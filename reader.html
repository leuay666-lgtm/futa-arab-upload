<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>قارئ المانغا - Futa Arab</title>
    <style>
        body { background-color: #070709; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 0px; background: transparent; } /* إخفاء شريط التمرير لقراءة نظيفة */
        
        /* شريط التنقل العلوي مع تأثير الإخفاء والظهور عند التمرير */
        #readerNavbar { transition: transform 0.3s ease-in-out; }
        .nav-hidden { transform: translateY(-100%); }

        /* حاوية الصور */
        .reader-page { width: 100%; max-w-3xl; margin: 0 auto; display: block; object-fit: contain; }
        
        /* عداد الصفحات العائم */
        .floating-counter { background: rgba(17, 17, 19, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(244, 114, 182, 0.4); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="relative min-h-screen flex flex-col items-center">

    <!-- شريط التنقل العلوي -->
    <nav id="readerNavbar" class="fixed top-0 left-0 w-full bg-[#121214]/95 backdrop-blur-md border-b border-gray-800/80 shadow-lg z-50 flex justify-between items-center px-4 py-3">
        <div class="flex items-center gap-3">
            <button onclick="goBack()" class="bg-[#1a1c23] hover:bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded-xl border border-gray-700 text-xs font-bold transition active:scale-95 flex items-center gap-2">
                <i class="fas fa-arrow-right"></i> <span>رجوع</span>
            </button>
        </div>
        <div class="flex-1 text-center overflow-hidden px-4">
            <h1 id="mangaTitleDisplay" class="text-sm font-black text-white truncate">جاري التحميل...</h1>
            <p id="chapterNumDisplay" class="text-[10px] text-accent font-bold mt-0.5">الفصل 1</p>
        </div>
        <div class="flex items-center gap-2">
            <button class="text-gray-400 hover:text-white p-2 active:scale-95 transition">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </nav>

    <!-- عداد الصفحات العائم -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 floating-counter px-4 py-1.5 rounded-full text-xs font-black text-white flex items-center gap-2">
        <span id="currentPageNum">1</span>
        <span class="text-gray-500">/</span>
        <span id="totalPagesNum" class="text-gray-400">?</span>
    </div>

    <!-- حاوية الصور (القارئ) -->
    <div id="pagesContainer" class="w-full max-w-3xl mx-auto flex flex-col items-center min-h-screen pt-16 pb-24 bg-[#070709]">
        <div class="text-center py-32 text-gray-500 text-sm font-bold">
            <i class="fas fa-spinner fa-spin text-4xl text-accent mb-4 block"></i>
            جاري تحميل صفحات الفصل...
        </div>
    </div>

    <!-- أزرار التنقل في أسفل الفصل -->
    <div id="chapterFooterNav" class="w-full max-w-3xl mx-auto px-4 pb-12 hidden flex-col items-center gap-4">
        <div class="h-px w-full bg-gray-800/60 mb-2"></div>
        <h3 class="text-sm font-black text-gray-400">نهاية الفصل</h3>
        <div class="flex w-full gap-3 justify-center">
            <button onclick="goToNextChapter()" class="flex-1 bg-[#1a1c23] hover:bg-gray-800 border border-gray-700 text-white font-bold py-3 rounded-xl transition active:scale-95 flex items-center justify-center gap-2 text-xs">
                <span>الفصل التالي</span> <i class="fas fa-chevron-left"></i>
            </button>
            <button onclick="goToPrevChapter()" class="flex-1 bg-[#1a1c23] hover:bg-gray-800 border border-gray-700 text-white font-bold py-3 rounded-xl transition active:scale-95 flex items-center justify-center gap-2 text-xs">
                <i class="fas fa-chevron-right"></i> <span>الفصل السابق</span>
            </button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://vosnoijtrovgtvpxnzsr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvc25vaWp0cm92Z3R2cHhuenNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDI0MjUsImV4cCI6MjEwNzU3ODQyNX0.k9B4P5vOMqNKFzpALb2aZrajjeyeKFaJW5qJz0iTqS0';
        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        const urlParams = new URLSearchParams(window.location.search);
        const mangaId = urlParams.get('id');
        const chapterNum = parseInt(urlParams.get('chapter')) || 1;
        
        let mangaData = null;
        let totalPages = 0;
        let lastScrollY = window.scrollY;
        const navbar = document.getElementById('readerNavbar');

        window.onload = async () => {
            if (!mangaId) {
                document.getElementById('pagesContainer').innerHTML = '<div class="text-red-500 py-20 text-center font-bold">خطأ: لم يتم تحديد العمل!</div>';
                return;
            }
            document.getElementById('chapterNumDisplay').innerText = `الفصل ${chapterNum}`;
            await fetchMangaAndPages();
        };

        function goBack() {
            window.location.href = `manga.html?id=${mangaId}`;
        }

        function goToNextChapter() {
            window.location.href = `reader.html?id=${mangaId}&chapter=${chapterNum + 1}`;
        }

        function goToPrevChapter() {
            if (chapterNum > 1) {
                window.location.href = `reader.html?id=${mangaId}&chapter=${chapterNum - 1}`;
            } else {
                alert('أنت في الفصل الأول بالفعل.');
            }
        }

        // إخفاء/إظهار النافبار عند التمرير
        window.addEventListener('scroll', () => {
            if (window.scrollY > lastScrollY && window.scrollY > 100) {
                navbar.classList.add('nav-hidden');
            } else {
                navbar.classList.remove('nav-hidden');
            }
            lastScrollY = window.scrollY;
        });

        // تسجيل العمل في "سجل القراءة" (History)
        function updateReadingHistory(pageIndex) {
            if (!mangaData) return;
            let history = JSON.parse(localStorage.getItem('futa_read_history') || '[]');
            
            // إزالة النسخة القديمة إن وجدت لرفعها للأعلى
            history = history.filter(item => item.id !== mangaData.id);
            
            history.unshift({
                id: mangaData.id,
                title: mangaData.title,
                cover_image_url: mangaData.cover_image_url,
                last_chapter: chapterNum,
                last_page: pageIndex + 1,
                timestamp: Date.now()
            });

            // الاحتفاظ بآخر 50 عمل فقط لعدم إثقال الذاكرة
            if (history.length > 50) history.pop();
            localStorage.setItem('futa_read_history', JSON.stringify(history));

            // تحديث مؤشر القراءة العام لصفحة manga.html لتعرف من أين تكمل
            localStorage.setItem(`reading_progress_${mangaId}`, JSON.stringify({
                chapterNum: chapterNum,
                pageIndex: pageIndex,
                updatedAt: Date.now()
            }));
        }

        async function fetchMangaAndPages() {
            try {
                // جلب تفاصيل المانغا
                const { data: manga, error: mangaErr } = await sbClient.from('mangas').select('*').eq('id', mangaId).single();
                if (mangaErr) throw mangaErr;
                mangaData = manga;
                document.getElementById('mangaTitleDisplay').innerText = manga.title;

                // جلب الصفحات (في المستقبل سنضيف فلتر eq('chapter_number', chapterNum))
                const { data: pages, error: pagesErr } = await sbClient
                    .from('manga_pages')
                    .select('*')
                    .eq('manga_id', mangaId)
                    .order('page_number', { ascending: true });

                if (pagesErr || !pages || pages.length === 0) {
                    document.getElementById('pagesContainer').innerHTML = '<div class="text-gray-500 py-32 text-center font-bold">هذا الفصل لا يحتوي على صفحات بعد.</div>';
                    return;
                }

                totalPages = pages.length;
                document.getElementById('totalPagesNum').innerText = totalPages;

                const pagesContainer = document.getElementById('pagesContainer');
                pagesContainer.innerHTML = pages.map((p, idx) => `
                    <img src="${p.image_url}" data-index="${idx}" class="reader-page w-full object-cover border-b border-gray-900" loading="lazy" alt="Page ${idx + 1}">
                `).join('');

                document.getElementById('chapterFooterNav').classList.remove('hidden');
                document.getElementById('chapterFooterNav').classList.add('flex');

                setupIntersectionObserver();

                // التمرير التلقائي لآخر صفحة توقف عندها في هذا الفصل إن وجدت
                const progress = JSON.parse(localStorage.getItem(`reading_progress_${mangaId}`));
                if (progress && progress.chapterNum === chapterNum && progress.pageIndex > 0) {
                    setTimeout(() => {
                        const targetImg = document.querySelector(`img[data-index="${progress.pageIndex}"]`);
                        if (targetImg) targetImg.scrollIntoView({ behavior: 'smooth' });
                    }, 500);
                } else {
                    updateReadingHistory(0); // تسجيل البداية
                }

            } catch (error) {
                document.getElementById('pagesContainer').innerHTML = '<div class="text-red-500 py-32 text-center font-bold">حدث خطأ أثناء الاتصال بالخادم.</div>';
            }
        }

        // مراقب ذكي لمعرفة أي صفحة يقرأها المستخدم حالياً
        function setupIntersectionObserver() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.5 // عندما تظهر 50% من الصورة في الشاشة
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageIndex = parseInt(entry.target.getAttribute('data-index'));
                        document.getElementById('currentPageNum').innerText = pageIndex + 1;
                        updateReadingHistory(pageIndex);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reader-page').forEach(img => {
                observer.observe(img);
            });
        }
    </script>
</body>
</html>
