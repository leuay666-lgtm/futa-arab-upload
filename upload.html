        // تهيئة حساب المستخدم المسجل وحساب عدد مرفوعاته

        async function refreshUserUploadsCount() {
            if (!currentUser || !currentUser.username) return;
            const counterEl = document.getElementById('userUploadsCounter');
            const localCount = parseInt(localStorage.getItem(`uploads_count_${currentUser.username}`) || '0');
            counterEl.innerText = localCount;

            try {
                const { count, error } = await sbClient
                    .from('mangas')
                    .select('*', { count: 'exact', head: true })
                    .eq('uploader_name', currentUser.username);

                if (!error && count !== null) {
                    const finalCount = Math.max(count, localCount);
                    counterEl.innerText = finalCount;
                    localStorage.setItem(`uploads_count_${currentUser.username}`, finalCount.toString());
                }

        }

        async function fetchTags() {
            try {
                const { data, error } = await sbClient.from('tags').select('*').order('name');
                if (error) throw error;
                
                tagsContainer.innerHTML = '';
                if (data.length === 0) {
                    tagsContainer.innerHTML = '<span class="text-xs text-gray-500">لا توجد تصنيفات حالياً.</span>';
                    return;
                }

                data.forEach(tag => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.innerText = tag.name;
                    btn.className = 'px-3 py-1 rounded-full text-xs font-bold border transition-colors bg-[#1a1c23] border-gray-700 text-gray-400 hover:bg-gray-800';
                    btn.onclick = () => {
                        if (selectedTags.has(tag.name)) {
                            selectedTags.delete(tag.name);
                            btn.classList.replace('bg-purple-600', 'bg-[#1a1c23]');
                            btn.classList.replace('text-white', 'text-gray-400');
                            btn.classList.replace('border-purple-500', 'border-gray-700');
                        } else {
                            selectedTags.add(tag.name);
                            btn.classList.replace('bg-[#1a1c23]', 'bg-purple-600');
                            btn.classList.replace('text-gray-400', 'text-white');
                            btn.classList.replace('border-gray-700', 'border-purple-500');
                        }
                    };
                    tagsContainer.appendChild(btn);
                });
            } catch (error) {
                tagsContainer.innerHTML = '<span class="text-xs text-red-500">فشل جلب التصنيفات!</span>';
            }
        }

        window.onload = () => {

        const COOLDOWN_MINUTES = 5;
        function checkCooldownAndUpload() {
            const lastUploadTime = localStorage.getItem('lastUploadTime');
            if (lastUploadTime) {
                const elapsedMinutes = (Date.now() - parseInt(lastUploadTime)) / (1000 * 60);
                if (elapsedMinutes < COOLDOWN_MINUTES) {
                    const remaining = Math.ceil(COOLDOWN_MINUTES - elapsedMinutes);
                    return alert(`⚠️ يرجى الانتظار ${remaining} دقيقة قبل رفع عمل جديد.`);
                }
            }
            uploadFullManga();
        }

        const naturalSort = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

        function compressImage(fileOrBlob, quality = 0.75, maxWidth = 1200) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(fileOrBlob);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        if (!blob) return reject(new Error('فشل ضغط الصورة'));
                        resolve(new File([blob], `img_${Date.now()}.webp`, { type: 'image/webp' }));
                    }, 'image/webp', quality);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذر قراءة صورة، قد تكون الصيغة غير مدعومة بالمتصفح')); };
                img.src = url;
            });
        }

        async function renderPdfPageToWebP(pdfDoc, pageNum, quality = 0.75, maxWidth = 1200) {
            const page = await pdfDoc.getPage(pageNum);
            const initialViewport = page.getViewport({ scale: 2.0 });
            let scale = initialViewport.width > maxWidth ? (maxWidth / initialViewport.width) * 2.0 : 2.0;
            const canvas = document.createElement('canvas');
            const viewport = page.getViewport({ scale: scale });
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => blob ? resolve(new File([blob], `pdf_${pageNum}.webp`, { type: 'image/webp' })) : reject(new Error('فشل PDF')), 'image/webp', quality);
            });
        }

        // دالة فحص البصمة الرقمية لمعرفة هل الملف صورة حقيقية مهما كان اسمه أو امتداده
        async function isImageFile(blob) {
            try {
                const buffer = await blob.slice(0, 12).arrayBuffer();
                const bytes = new Uint8Array(buffer);
                if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF) return true; // JPEG
                if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) return true; // PNG
                if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x38) return true; // GIF
                if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
                    bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) return true; // WEBP
                return false;
            } catch (e) {
                return false;
            }
        }

        async function prepareChapterTasks(fileList, updateStatus) {
            const tasks = [], directImages = [], files = Array.from(fileList);
            for (const file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                
                if (['zip', 'cbz', 'epub'].includes(ext)) {
                    updateStatus(`<i class="fas fa-file-archive fa-bounce"></i> جاري فحص ملف الـ ZIP بالكامل...`);
                    const zip = await JSZip.loadAsync(file);
                    const validEntries = [];
                    
                    const entries = Object.values(zip.files).filter(entry => !entry.dir && !entry.name.includes('__MACOSX') && !entry.name.includes('.DS_Store'));
                    
                    for (let i = 0; i < entries.length; i++) {
                        const entry = entries[i];
                        const blob = await entry.async('blob');
                        const hasImgExt = /\.(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i.test(entry.name);
                        
                        // الفحص الذكي: يقبل الملف إذا كان اسمه صورة، أو إذا كانت بصمته الرقمية صورة
                        if (hasImgExt || (await isImageFile(blob))) {
                            validEntries.push({ name: entry.name, blob: blob });
                        }
                    }

                    if (validEntries.length === 0) {
                        throw new Error('تعذر العثور على صور داخل الملف المضغوط! تأكد أن الملف ليس RAR تم تغيير امتداده فقط.');
                    }

                    validEntries.sort((a, b) => naturalSort.compare(a.name, b.name));
                    validEntries.forEach(item => {
                        tasks.push({ getWebP: async () => compressImage(item.blob, 0.70) });
                    });
                
                } else if (ext === 'pdf') {
                    updateStatus(`<i class="fas fa-file-pdf fa-bounce"></i> تحليل صفحات PDF...`);
                    const pdfDoc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                    for (let p = 1; p <= pdfDoc.numPages; p++) tasks.push({ getWebP: async () => renderPdfPageToWebP(pdfDoc, p, 0.70) });
                } else if (file.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|avif|heic|heif)$/i.test(file.name)) {
                    directImages.push(file);
                }
            }
            if (directImages.length > 0) {
                directImages.sort((a, b) => naturalSort.compare(a.name, b.name));
                directImages.forEach(img => tasks.push({ getWebP: async () => compressImage(img, 0.70) }));
            }
            return tasks;
        }

        function updateProgressUI(text, percentage = null) {
            document.getElementById('statusText').innerHTML = text;
            const container = document.getElementById('progressBarContainer');
            if (percentage !== null) { container.classList.remove('hidden'); document.getElementById('progressBarFill').style.width = `${percentage}%`; } 
            else container.classList.add('hidden');
        }

        async function uploadFullManga() {
            const title = document.getElementById('mangaTitle').value.trim();
            const titleEn = document.getElementById('mangaTitleEn').value.trim() || null;
            const desc = document.getElementById('mangaDesc').value.trim() || null;
            const uploader = (currentUser && currentUser.username) ? currentUser.username : (document.getElementById('uploaderName').value.trim() || 'مجهول');
            const coverFile = document.getElementById('mangaCover').files[0];
            const pageFiles = document.getElementById('mangaPages').files;
            const btn = document.getElementById('uploadBtn');
            const statusDiv = document.getElementById('statusDiv');

            if (!title || !coverFile || pageFiles.length === 0) return alert('⚠️ يرجى تعبئة الحقول الإجبارية (العنوان، الغلاف، ملف الفصل)!');

            btn.disabled = true;
            statusDiv.classList.remove('hidden');
            statusDiv.className = 'text-center text-sm font-bold p-3 rounded-xl border border-blue-900 bg-blue-900/20 text-blue-400 space-y-2';
            
            try {
                const pageTasks = await prepareChapterTasks(pageFiles, (msg) => updateProgressUI(msg, 5));
                if (pageTasks.length === 0) throw new Error('لم يتم العثور على صور صالحة!');

                updateProgressUI('<i class="fas fa-compress-arrows-alt"></i> جاري رفع الغلاف...', 10);
                const coverName = `cover_${Date.now()}_${Math.random().toString(36).substring(2, 7)}.webp`;
                const { error: coverErr } = await sbClient.storage.from('manga-covers').upload(coverName, await compressImage(coverFile, 0.75));
                if (coverErr) throw coverErr;
                const coverUrl = sbClient.storage.from('manga-covers').getPublicUrl(coverName).data.publicUrl;

                updateProgressUI('<i class="fas fa-spinner fa-spin"></i> جاري تسجيل البيانات...', 15);
                
                // دمج نوع العمل مع التصنيفات لضمان ظهوره في الواجهة الرئيسية وحفظه في الداتابيز
                const finalTagsArray = [selectedWorkType, ...Array.from(selectedTags)];
                const baseMangaData = { 
                    title: title, 
                    title_en: titleEn,
                    description: desc,
                    uploader_name: uploader,
                    tags: finalTagsArray.join(','),
                    cover_image_url: coverUrl, 
                    status: 'pending' 
                };

                // محاولة الحفظ مع حقل work_type، وفي حال عدم وجود العمود في الداتابيز يتم الحفظ بدونه تلقائياً
                let newManga = null;
                const { data: tryManga, error: tryErr } = await sbClient.from('mangas').insert([{ ...baseMangaData, work_type: selectedWorkType }]).select();
                if (tryErr) {
                    const { data: fallbackManga, error: mangaErr } = await sbClient.from('mangas').insert([baseMangaData]).select();
                    if (mangaErr) throw mangaErr;
                    newManga = fallbackManga;
                } else {
                    newManga = tryManga;
                }

                const mangaId = newManga[0].id;

                const totalPages = pageTasks.length;
                for (let i = 0; i < totalPages; i++) {
                    updateProgressUI(`<i class="fas fa-cloud-upload-alt"></i> رفع صفحة (${i + 1}/${totalPages})...`, Math.round(15 + ((i + 1) / totalPages) * 85));
                    const pageName = `page_${mangaId}_${i + 1}_${Math.random().toString(36).substring(2, 7)}.webp`;
                    const { error: pErr } = await sbClient.storage.from('manga-pages').upload(pageName, await pageTasks[i].getWebP());
                    if (pErr) throw pErr;
                    
                    await sbClient.from('manga_pages').insert([{
                        manga_id: mangaId,
                        image_url: sbClient.storage.from('manga-pages').getPublicUrl(pageName).data.publicUrl,
                        page_number: i + 1
                    }]);
                }

                localStorage.setItem('lastUploadTime', Date.now().toString());

                // تحديث وتخزين عدد تحميلات المستخدم المسجل
                if (currentUser && currentUser.username) {
                    const currentCount = parseInt(localStorage.getItem(`uploads_count_${currentUser.username}`) || '0') + 1;
                    localStorage.setItem(`uploads_count_${currentUser.username}`, currentCount.toString());
                    document.getElementById('userUploadsCounter').innerText = currentCount;
                    try {
                        await sbClient.from('profiles').update({ uploads_count: currentCount }).eq('username', currentUser.username);
                    } catch (e) {}
                }

                statusDiv.className = 'text-center text-sm font-bold p-3 rounded-xl border border-green-900 bg-green-900/20 text-green-400 space-y-2';
                updateProgressUI(`<i class="fas fa-check-circle"></i> تم رفع العمل بنجاح! ننتظر موافقة الإدارة.`, 100);
                
                document.querySelectorAll('input:not([readonly]), textarea').forEach(el => el.value = '');
                selectedTags.clear();
                selectWorkType('مانغا');
                fetchTags();

            } catch (error) {
                statusDiv.className = 'text-center text-sm font-bold p-3 rounded-xl border border-red-900 bg-red-900/20 text-red-400 space-y-2';
                updateProgressUI('<i class="fas fa-times-circle"></i> خطأ: ' + error.message, null);
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
