<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>رفع عمل جديد - Futa Arab</title>
</head>
<body class="bg-[#0b0c10] text-white min-h-screen p-4 flex items-center justify-center">

    <div class="bg-[#12141d] p-6 rounded-3xl border border-gray-800 shadow-2xl max-w-md w-full">
        <h1 class="text-2xl font-black mb-6 text-center text-purple-400">
            <i class="fas fa-upload mb-2 block text-3xl"></i>
            منصة رفع الأعمال
        </h1>
        
        <div class="space-y-4">
            <!-- اسم المانغا -->
            <div>
                <label class="text-sm text-gray-400 mb-1 block">عنوان المانغا</label>
                <input id="mangaTitle" type="text" placeholder="اكتب العنوان..." class="w-full bg-[#1a1c23] p-3 rounded-xl border border-gray-700 outline-none text-white focus:border-purple-500">
            </div>
            
            <!-- الغلاف -->
            <div>
                <label class="text-sm text-gray-400 mb-1 block">الغلاف الرسمي (صورة واحدة)</label>
                <input id="mangaCover" type="file" accept="image/*" class="w-full bg-[#1a1c23] p-2 rounded-xl border-2 border-dashed border-gray-700 text-gray-400 text-sm">
            </div>

            <!-- صفحات الفصل -->
            <div class="bg-indigo-900/20 p-4 rounded-xl border border-indigo-900/50">
                <label class="text-sm text-indigo-300 mb-1 block font-bold">صفحات الفصل (اختر كل الصور)</label>
                <input id="mangaPages" type="file" accept="image/*" multiple class="w-full bg-[#1a1c23] p-2 rounded-xl border-2 border-dashed border-indigo-700 text-gray-400 text-sm">
                <p class="text-xs text-indigo-400 mt-2">
                    <i class="fas fa-magic"></i> سيتم ضغط وتخفيف حجم الصور تلقائياً لتسريع الموقع.
                </p>
            </div>

            <!-- شريط التقدم -->
            <div id="statusDiv" class="hidden text-center text-sm font-bold p-3 rounded-xl bg-[#1a1c23] border border-gray-700">
                <span id="statusText">جاري الرفع...</span>
            </div>

            <button onclick="uploadFullManga()" id="uploadBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 font-bold py-3 rounded-xl transition hover:opacity-90 active:scale-95">
                رفع العمل للمراجعة
            </button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://vosnoijtrovgtvpxnzsr.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvc25vaWp0cm92Z3R2cHhuenNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMDI0MjUsImV4cCI6MjEwNzU3ODQyNX0.k9B4P5vOMqNKFzpALb2aZrajjeyeKFaJW5qJz0iTqS0';
        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        // الدالة السحرية لضغط وتخفيف الصور
        function compressImage(file, quality = 0.75, maxWidth = 1200) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // تصغير الأبعاد إذا كانت الصورة ضخمة جداً
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // تحويل الصورة إلى صيغة WebP الخفيفة
                        canvas.toBlob((blob) => {
                            if (!blob) return reject(new Error('فشل ضغط الصورة'));
                            const newFileName = file.name.replace(/\.[^/.]+$/, "") + ".webp";
                            const compressedFile = new File([blob], newFileName, {
                                type: 'image/webp',
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        }, 'image/webp', quality);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        async function uploadFullManga() {
            const title = document.getElementById('mangaTitle').value;
            const coverFile = document.getElementById('mangaCover').files[0];
            const pageFiles = document.getElementById('mangaPages').files;
            const btn = document.getElementById('uploadBtn');
            const statusDiv = document.getElementById('statusDiv');
            const statusText = document.getElementById('statusText');

            if(!title || !coverFile || pageFiles.length === 0) {
                return alert('⚠️ يرجى إدخال العنوان، واختيار الغلاف، واختيار صفحات الفصل!');
            }

            btn.disabled = true;
            statusDiv.classList.remove('hidden');
            statusDiv.className = 'text-center text-sm font-bold p-3 rounded-xl border border-blue-900 bg-blue-900/20 text-blue-400';
            
            try {
                // 1. ضغط ورفع صورة الغلاف
                statusText.innerHTML = '<i class="fas fa-compress-arrows-alt"></i> جاري ضغط ورفع الغلاف...';
                const compressedCover = await compressImage(coverFile);
                const coverName = `cover_${Math.random()}.webp`;
                const { error: coverUploadError } = await sbClient.storage.from('manga-covers').upload(coverName, compressedCover);
                if (coverUploadError) throw coverUploadError;
                const coverUrl = sbClient.storage.from('manga-covers').getPublicUrl(coverName).data.publicUrl;

                // 2. إنشاء المانغا في جدول mangas
                statusText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل البيانات...';
                const { data: newManga, error: mangaError } = await sbClient.from('mangas')
                    .insert([{ title: title, cover_image_url: coverUrl, status: 'pending' }])
                    .select();
                if (mangaError) throw mangaError;
                const mangaId = newManga[0].id;

                // 3. ضغط ورفع صفحات الفصل
                for (let i = 0; i < pageFiles.length; i++) {
                    statusText.innerHTML = `<i class="fas fa-compress-arrows-alt"></i> جاري ضغط ورفع صفحة (${i + 1}/${pageFiles.length})...`;
                    
                    const compressedPage = await compressImage(pageFiles[i], 0.70); // ضغط أقوى للصفحات
                    let pageName = `page_${mangaId}_${i}_${Math.random()}.webp`;
                    
                    let { error: pageUploadError } = await sbClient.storage.from('manga-pages').upload(pageName, compressedPage);
                    if (pageUploadError) throw pageUploadError;
                    
                    let pageUrl = sbClient.storage.from('manga-pages').getPublicUrl(pageName).data.publicUrl;
                    
                    await sbClient.from('manga_pages').insert([{
                        manga_id: mangaId,
                        image_url: pageUrl,
                        page_number: i + 1
                    }]);
                }

                // النجاح
                statusDiv.className = 'text-center text-sm font-bold p-3 rounded-xl border border-green-900 bg-green-900/20 text-green-400';
                statusText.innerHTML = '<i class="fas fa-check-circle"></i> تم رفع العمل بنجاح! هو الآن قيد المراجعة.';
                
                document.getElementById('mangaTitle').value = '';
                document.getElementById('mangaCover').value = '';
                document.getElementById('mangaPages').value = '';

            } catch (error) {
                statusDiv.className = 'text-center text-sm font-bold p-3 rounded-xl border border-red-900 bg-red-900/20 text-red-400';
                statusText.innerHTML = '<i class="fas fa-times-circle"></i> خطأ: ' + error.message;
            }
            
            btn.disabled = false;
        }
    </script>
</body>
</html>
